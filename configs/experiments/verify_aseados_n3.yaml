experiment_id: verify_aseados_natural_n3
dataset: aseados_sdn_iot
task: binary
partition_type: natural
num_tenants: 3
rounds: 30
local_epochs: 3
batch_size: 128
lr: 0.001
weight_decay: 0.0001
scaler_mode: global
max_train_samples: 24000
eval_every: 1
eval_per_tenant_every: 5
aggregator: secure_fedavg
aggregator_kwargs:
  scale_bits: 20
seeds: [0, 1, 2, 3, 4]
model:
  type: gru
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  seq_mode: single_step
  num_chunks: 1
output_dir: results/06_verify
