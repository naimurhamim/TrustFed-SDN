# E7 — Live SDN Testbed Integration, Poisoning Defense, Tamper Rejection & OVS Mitigation
experiment_id: E7_live_testbed
step_sources:
  - results/07_testbed/summary.json
  - results/07_testbed/sim_to_live_gap.csv
  - results/08_live/summary.json
  - results/08_live/per_round_metrics.csv
  - results/08_live/vm_live_mitigation.json
testbed_environment: Ubuntu 22.04 LTS + Mininet 2.3.0 + OVS 2.17.12 + OS-Ken 3.0.1 OpenFlow 1.3
num_tenants: 3
rounds: 12
local_epochs: 2
mean_epsilon: 2.0
delta: 1.0e-5
seeds: [0, 1, 2, 3, 4]
attack_threshold_calibrated: 0.98
ovs_drop_priority: 300
metrics:
  - intra_loss_pct
  - cross_block_pct
  - f1_macro
  - attack_detection_rate
  - malicious_rejection_rate_mean
  - tamper_detection_rate_pct
  - ovs_drop_install_ms
  - attack_block_rate_pct
  - false_block_rate_pct
  - total_round_ms
