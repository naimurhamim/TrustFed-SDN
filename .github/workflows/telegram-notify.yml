name: Telegram Milestone Notification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      step:
        description: "Optional step number (e.g. 07)"
        required: false
        default: ""
      note:
        description: "Optional custom note to include in the message"
        required: false
        default: ""

concurrency:
  group: telegram-notify-${{ github.sha }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_STEP: ${{ github.event.inputs.step }}
          INPUT_NOTE: ${{ github.event.inputs.note }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PUSHER_ACTOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set; skipping notification."
            exit 0
          fi
          ARGS=()
          if [ "${EVENT_NAME}" = "push" ]; then
            ARGS+=(--push-event --before "${BEFORE_SHA}" --after "${AFTER_SHA}" --actor "${PUSHER_ACTOR}" --branch "${BRANCH_NAME}")
          fi
          if [ -n "${INPUT_STEP:-}" ]; then
            ARGS+=(--step "${INPUT_STEP}")
          elif [[ "${GITHUB_REF}" == refs/tags/step-*-done ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/step-}"
            STEP_NUM="${TAG_NAME%-done}"
            ARGS+=(--step "${STEP_NUM}")
          fi
          if [ -n "${INPUT_NOTE:-}" ]; then
            ARGS+=(--note "${INPUT_NOTE}")
          fi
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(PROGRESS\.md|docs/TEAM_CHECKLIST\.md)$' || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            ARGS+=(--attach docs/PRITOM_ANTIGRAVITY_SETUP.md --attach docs/TEAM_CHECKLIST.md)
          fi
          python scripts/notify_telegram.py "${ARGS[@]}"
